version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: nexus-id-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: nexus_id
      MYSQL_USER: nexus_user
      MYSQL_PASSWORD: nexus_password
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deployments/mysql/init:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: nexus-id-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexus-id-backend
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - NEXUS_DATABASE_HOST=mysql
      - NEXUS_DATABASE_PORT=3306
      - NEXUS_DATABASE_USER=nexus_user
      - NEXUS_DATABASE_PASSWORD=nexus_password
      - NEXUS_DATABASE_DBNAME=nexus_id
      - NEXUS_REDIS_HOST=redis
      - NEXUS_REDIS_PORT=6379
      - NEXUS_SERVER_MODE=debug
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
